{% set name = "pydata-sphinx-theme" %}
{% set version = "0.20.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pydata_sphinx_theme-{{ version }}.tar.gz
  sha256: 0da172d41e19a66de875f4002f7054b385372ec65763852193791e658d50bb4a
  patches:
    - 000_set_nodejs_version.patch

build:
  number: 0
  script:
    - export STB_USE_SYSTEM_NODE=1  # [linux]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<311]

requirements:
  build:
  host:
    - pip
    - python
    # babel is a missing host dependency, needed for sphinx-theme-builder
    - babel
    - nodejs 26.5.1
    - sphinx-theme-builder >=0.3.2
    - wheel
  run:
    - python
    - sphinx >=8.2,<10
    - beautifulsoup4
    - docutils !=0.17.0
    - babel
    - pygments >=2.7
    - accessible-pygments
    - jinja2
    - requests

test:
  source_files:
    - pyproject.toml
    - tests
  imports:
    - pydata_sphinx_theme
  commands:
    - pip check
    # ignoring test_build.py because we need pytest-regressions
    - pytest -n auto tests --ignore=tests/test_build.py
  requires:
    - pip
    - pytest
    - pytest-xdist
    - defusedxml

about:
  home: https://github.com/pydata/pydata-sphinx-theme
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Bootstrap-based Sphinx theme from the PyData community
  description: |
    A clean, three-column, Bootstrap-based Sphinx theme by and for the PyData community.
  doc_url: https://github.com/pydata/pydata-sphinx-theme/blob/main/README.md
  dev_url: https://github.com/pydata/pydata-sphinx-theme

extra:
  recipe-maintainers:
    - jorisvandenbossche
    - bollwyvl
